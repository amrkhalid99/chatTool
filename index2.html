<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ FAST REPLY · VAS Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&family=Outfit:wght@600;700;800;900&family=Nunito:wght@700;800;900&family=Fira+Code:wght@500;600;700&family=Playfair+Display:wght@700;900&display=swap"
        rel="stylesheet">

    <style>
        /* =================== THEME DEFINITIONS =================== */
        :root {
            --font-ui: 'Outfit', sans-serif;
            --font-display: 'Syne', sans-serif;
            --transition-theme: background-color 0.35s ease, color 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
        }

        [data-theme="light"] {
            --bg: #f6f9fc;
            --surface: #ffffff;
            --surface-hover: #f2f5f9;
            --border: #e2e8f0;
            --text-primary: #1a2b3e;
            --text-secondary: #4a5a6e;
            --accent: #2563eb;
            --accent-soft: #dbeafe;
            --danger: #dc2626;
            --success: #059669;
            --pinned-star: #fbbf24;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, .07);
            --card-shadow: 0 2px 8px rgba(0, 0, 0, .04);
            --ctx-bg: #ffffff;
            --logo-a: #ff6600;
            --logo-b: #ff9900;
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-hover: #2d3a4f;
            --border: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #b0c4de;
            --accent: #3b82f6;
            --accent-soft: #1e3a5f;
            --danger: #f87171;
            --success: #34d399;
            --pinned-star: #fbbf24;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, .5);
            --card-shadow: 0 4px 12px rgba(0, 0, 0, .4);
            --ctx-bg: #1e293b;
            --logo-a: #fb923c;
            --logo-b: #fbbf24;
        }

        [data-theme="midnight"] {
            --bg: #0d0d1a;
            --surface: #14142b;
            --surface-hover: #1e1e3f;
            --border: #2d2d5e;
            --text-primary: #e8e8ff;
            --text-secondary: #9090cc;
            --accent: #7c3aed;
            --accent-soft: #2d1b5e;
            --danger: #f87171;
            --success: #a78bfa;
            --pinned-star: #fbbf24;
            --shadow: 0 10px 30px rgba(124, 58, 237, .3);
            --card-shadow: 0 4px 16px rgba(124, 58, 237, .15);
            --ctx-bg: #14142b;
            --logo-a: #a78bfa;
            --logo-b: #f472b6;
            --font-ui: 'Space Mono', monospace;
            --font-display: 'Space Mono', monospace;
        }

        [data-theme="cyberpunk"] {
            --bg: #0a0a0f;
            --surface: #111118;
            --surface-hover: #1a1a28;
            --border: #00ff9f33;
            --text-primary: #00ff9f;
            --text-secondary: #00cc7f;
            --accent: #ff00aa;
            --accent-soft: #ff00aa22;
            --danger: #ff4444;
            --success: #00ff9f;
            --pinned-star: #ffee00;
            --shadow: 0 0 20px #ff00aa44;
            --card-shadow: 0 0 10px #00ff9f22;
            --ctx-bg: #111118;
            --logo-a: #00ff9f;
            --logo-b: #ff00aa;
            --font-ui: 'Fira Code', monospace;
            --font-display: 'Fira Code', monospace;
        }

        [data-theme="anime"] {
            --bg: #fff0f5;
            --surface: #ffffff;
            --surface-hover: #ffe4ef;
            --border: #ffc0d9;
            --text-primary: #5c2a45;
            --text-secondary: #a06080;
            --accent: #e91e8c;
            --accent-soft: #ffd6eb;
            --danger: #ff4466;
            --success: #22c55e;
            --pinned-star: #ff9800;
            --shadow: 0 8px 24px rgba(233, 30, 140, .12);
            --card-shadow: 0 2px 12px rgba(233, 30, 140, .08);
            --ctx-bg: #ffffff;
            --logo-a: #e91e8c;
            --logo-b: #9c27b0;
            --font-ui: 'Nunito', sans-serif;
            --font-display: 'Nunito', sans-serif;
        }

        [data-theme="forest"] {
            --bg: #0f1f0f;
            --surface: #162016;
            --surface-hover: #1f2e1f;
            --border: #2d4a2d;
            --text-primary: #d4edda;
            --text-secondary: #8fbc8f;
            --accent: #4caf50;
            --accent-soft: #1a3a1a;
            --danger: #ff6b6b;
            --success: #69f0ae;
            --pinned-star: #ffd54f;
            --shadow: 0 10px 25px rgba(0, 0, 0, .5);
            --card-shadow: 0 4px 16px rgba(76, 175, 80, .1);
            --ctx-bg: #162016;
            --logo-a: #69f0ae;
            --logo-b: #4caf50;
        }

        [data-theme="sunset"] {
            --bg: #1a0a00;
            --surface: #2a1200;
            --surface-hover: #3a1e00;
            --border: #6b3000;
            --text-primary: #ffe8cc;
            --text-secondary: #ffaa66;
            --accent: #ff6600;
            --accent-soft: #4a1a00;
            --danger: #ff4444;
            --success: #ffcc00;
            --pinned-star: #ffcc00;
            --shadow: 0 10px 30px rgba(255, 102, 0, .3);
            --card-shadow: 0 4px 16px rgba(255, 102, 0, .15);
            --ctx-bg: #2a1200;
            --logo-a: #ff6600;
            --logo-b: #ff9900;
        }

        [data-theme="ocean"] {
            --bg: #001824;
            --surface: #002233;
            --surface-hover: #003044;
            --border: #0066aa55;
            --text-primary: #c0eeff;
            --text-secondary: #60aacc;
            --accent: #00aaff;
            --accent-soft: #002244;
            --danger: #ff6688;
            --success: #00ffcc;
            --pinned-star: #ffdd44;
            --shadow: 0 10px 30px rgba(0, 170, 255, .2);
            --card-shadow: 0 4px 16px rgba(0, 170, 255, .1);
            --ctx-bg: #002233;
            --logo-a: #00aaff;
            --logo-b: #00ffcc;
        }

        [data-theme="paper"] {
            --bg: #f5f0e8;
            --surface: #faf7f0;
            --surface-hover: #ede8dc;
            --border: #d4c9b0;
            --text-primary: #3d2b1f;
            --text-secondary: #7a6652;
            --accent: #8b4513;
            --accent-soft: #e8d9c0;
            --danger: #c0392b;
            --success: #2e7d32;
            --pinned-star: #f39c12;
            --shadow: 0 4px 16px rgba(139, 69, 19, .12);
            --card-shadow: 0 2px 8px rgba(139, 69, 19, .08);
            --ctx-bg: #faf7f0;
            --logo-a: #8b4513;
            --logo-b: #cc6600;
            --font-ui: 'Playfair Display', serif;
            --font-display: 'Playfair Display', serif;
        }

        [data-theme="mono"] {
            --bg: #111111;
            --surface: #1a1a1a;
            --surface-hover: #222222;
            --border: #333333;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --accent: #ffffff;
            --accent-soft: #2a2a2a;
            --danger: #ff4444;
            --success: #44ff44;
            --pinned-star: #ffee00;
            --shadow: 0 4px 20px rgba(0, 0, 0, .8);
            --card-shadow: 0 2px 8px rgba(0, 0, 0, .6);
            --ctx-bg: #1a1a1a;
            --logo-a: #ffffff;
            --logo-b: #888888;
            --font-ui: 'Space Mono', monospace;
            --font-display: 'Space Mono', monospace;
        }

        [data-theme="nord"] {
            --bg: #2e3440;
            --surface: #3b4252;
            --surface-hover: #434c5e;
            --border: #4c566a;
            --text-primary: #eceff4;
            --text-secondary: #d8dee9;
            --accent: #88c0d0;
            --accent-soft: #3b4252;
            --danger: #bf616a;
            --success: #a3be8c;
            --pinned-star: #ebcb8b;
            --shadow: 0 8px 24px rgba(0, 0, 0, .4);
            --card-shadow: 0 2px 12px rgba(0, 0, 0, .3);
            --ctx-bg: #3b4252;
            --logo-a: #88c0d0;
            --logo-b: #b48ead;
        }

        [data-theme="lava"] {
            --bg: #110000;
            --surface: #1a0000;
            --surface-hover: #2a0500;
            --border: #4a0a00;
            --text-primary: #ffccaa;
            --text-secondary: #ff6644;
            --accent: #ff2200;
            --accent-soft: #2a0500;
            --danger: #ff4422;
            --success: #ff9900;
            --pinned-star: #ffcc00;
            --shadow: 0 10px 30px rgba(255, 34, 0, .3);
            --card-shadow: 0 4px 16px rgba(255, 34, 0, .15);
            --ctx-bg: #1a0000;
            --logo-a: #ff4400;
            --logo-b: #ff9900;
        }

        /* =================== BASE =================== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-ui);
            font-weight: 600;
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 1rem;
            line-height: 1.5;
            transition: var(--transition-theme);
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        /* =================== NAV =================== */
        .nav-bar {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 0.75rem 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            box-shadow: var(--card-shadow);
            transition: var(--transition-theme);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .logo h1 {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(145deg, var(--logo-a), var(--logo-b));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            white-space: nowrap;
        }

        /* ── Navigation Tab Switcher ── */
        .page-nav {
            display: flex;
            gap: 0.5rem;
            background: var(--surface-hover);
            border-radius: 10px;
            padding: 4px;
            border: 1px solid var(--border);
        }

        .page-nav a {
            padding: 0.4rem 1rem;
            border-radius: 7px;
            font-size: 0.88rem;
            font-weight: 700;
            font-family: var(--font-ui);
            text-decoration: none;
            color: var(--text-secondary);
            transition: all 0.18s;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .page-nav a.active,
        .page-nav a:hover {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .nav-search {
            display: flex;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 0.4rem 1rem;
            align-items: center;
            gap: 8px;
            min-width: 280px;
            transition: var(--transition-theme);
        }

        .nav-search:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .nav-search i {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .nav-search input {
            border: none;
            background: transparent;
            outline: none;
            color: var(--text-primary);
            font-size: 0.9rem;
            width: 100%;
            font-family: var(--font-ui);
            font-weight: 600;
        }

        .nav-search input::placeholder {
            color: var(--text-secondary);
        }

        .clear-search-nav {
            cursor: pointer;
            transition: color 0.15s;
        }

        .clear-search-nav:hover {
            color: var(--danger);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        /* Buttons */
        .nav-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            padding: 0.5rem 1.2rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-primary);
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            white-space: nowrap;
            font-family: var(--font-ui);
            font-weight: 600;
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #ffffff !important;
        }

        .btn:hover {
            background: var(--surface-hover);
            color: var(--text-primary);
        }

        .btn-primary:hover {
            background: var(--accent) !important;
            filter: brightness(1.15);
            color: #ffffff !important;
        }

        .btn-danger {
            background: var(--danger);
            border-color: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            filter: brightness(1.1);
        }

        /* Stats */
        .stats-mini {
            display: flex;
            gap: 1.2rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
            align-items: center;
        }

        .stat-mini-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .stat-mini-item i {
            font-size: 0.8rem;
        }

        .stat-mini-num {
            font-weight: 700;
            color: var(--text-primary);
            font-family: var(--font-display);
        }

        /* Theme Dropdown */
        .theme-wrapper {
            position: relative;
        }

        .theme-toggle {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.45rem 0.9rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface);
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-primary);
            font-family: var(--font-ui);
            transition: 0.15s;
        }

        .theme-toggle:hover {
            background: var(--surface-hover);
        }

        .theme-dropdown {
            position: absolute;
            right: 0;
            top: calc(100% + 8px);
            background: var(--ctx-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 6px;
            z-index: 500;
            min-width: 180px;
            box-shadow: var(--shadow);
            display: none;
            animation: dropIn 0.15s ease;
        }

        .theme-dropdown.open {
            display: block;
        }

        .theme-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0.5rem 0.75rem;
            border-radius: 7px;
            cursor: pointer;
            font-size: 0.875rem;
            color: var(--text-primary);
            transition: background 0.15s;
            font-family: var(--font-ui);
            font-weight: 600;
        }

        .theme-option:hover {
            background: var(--surface-hover);
        }

        .theme-option.active {
            background: var(--accent-soft);
            color: var(--accent);
        }

        .theme-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            flex-shrink: 0;
            border: 2px solid var(--border);
        }

        /* =================== SEARCH PILLS =================== */
        .category-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin: 1rem 0;
            align-items: center;
        }

        .category-pill {
            padding: 0.4rem 1rem;
            border-radius: 30px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-primary);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: var(--font-ui);
            font-weight: 600;
        }

        .category-pill:hover {
            background: var(--surface-hover);
            border-color: var(--accent);
        }

        .category-pill.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* =================== VAS GRID =================== */
        .vas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        /* =================== VAS CARD =================== */
        .vas-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.1rem 1.2rem;
            box-shadow: var(--card-shadow);
            cursor: pointer;
            position: relative;
            animation: cardIn 0.25s ease both;
            transition: all 0.2s;
            overflow: hidden;
        }

        .vas-card:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
            box-shadow: var(--shadow);
        }

        .vas-card.copied {
            border-color: var(--success);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .vas-title {
            font-weight: 800;
            font-size: 1rem;
            color: var(--text-primary);
            font-family: var(--font-display);
            line-height: 1.3;
            margin-bottom: 0.5rem;
            word-break: break-word;
            direction: auto;
        }

        .vas-info-preview {
            font-size: 0.82rem;
            color: var(--text-secondary);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            direction: rtl;
            text-align: right;
            line-height: 1.5;
            opacity: 0.7;
        }

        /* ── Copy flash indicator ── */
        .copy-flash {
            position: absolute;
            inset: 0;
            background: var(--accent-soft);
            border-radius: 14px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .vas-card.copied .copy-flash {
            opacity: 1;
        }

        /* ── Tooltip for Description on hover ── */
        .vas-card .vas-tooltip {
            display: none;
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%);
            background: var(--ctx-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.75rem 1rem;
            font-size: 0.82rem;
            color: var(--text-secondary);
            white-space: pre-wrap;
            max-width: 320px;
            min-width: 180px;
            box-shadow: var(--shadow);
            z-index: 200;
            line-height: 1.6;
            text-align: left;
            direction: ltr;
            pointer-events: none;
        }

        .vas-card .vas-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 7px solid transparent;
            border-top-color: var(--border);
        }

        .vas-card:hover .vas-tooltip {
            display: block;
            animation: tooltipIn 0.15s ease;
        }

        @keyframes tooltipIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(4px);
            }

            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* ── Card action area ── */
        .vas-card-bottom {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            margin-top: 0.7rem;
            gap: 0.4rem;
        }

        .vas-copy-hint {
            font-size: 0.75rem;
            color: var(--text-secondary);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .vas-card:hover .vas-copy-hint {
            opacity: 1;
        }

        /* ── Context Menu ── */
        .ctx-menu {
            position: fixed;
            background: var(--ctx-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.4rem;
            z-index: 9999;
            min-width: 170px;
            box-shadow: var(--shadow);
            display: none;
            animation: dropIn 0.15s ease;
        }

        .ctx-menu.open {
            display: block;
        }

        .ctx-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0.55rem 0.8rem;
            border-radius: 7px;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-primary);
            font-family: var(--font-ui);
            font-weight: 600;
            transition: background 0.12s;
        }

        .ctx-item:hover {
            background: var(--surface-hover);
        }

        .ctx-item.danger {
            color: var(--danger);
        }

        .ctx-item.danger:hover {
            background: #ff000015;
        }

        .ctx-divider {
            height: 1px;
            background: var(--border);
            margin: 0.3rem 0;
        }

        /* ── Delete Modal ── */
        .delete-modal {
            max-width: 360px;
            text-align: center;
        }

        .delete-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            10%,
            30%,
            50%,
            70%,
            90% {
                transform: translateX(-5px);
            }

            20%,
            40%,
            60%,
            80% {
                transform: translateX(5px);
            }
        }

        .delete-modal h3 {
            margin: 0 0 0.5rem;
            font-size: 1.3rem;
            color: var(--danger);
        }

        .delete-title {
            color: var(--text-primary);
            font-weight: 600;
            margin: 0.5rem 0;
            word-break: break-word;
        }

        .delete-warning {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin: 1rem 0;
        }

        /* ── Modal ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(6px);
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }

        .modal-overlay.show {
            visibility: visible;
            opacity: 1;
        }

        .modal {
            background: var(--surface);
            border-radius: 16px;
            width: 90%;
            max-width: 500px;
            padding: 1.5rem;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            animation: modalPop 0.25s ease;
            transition: var(--transition-theme);
        }

        .modal h2 {
            margin-bottom: 1rem;
            font-size: 1.3rem;
            font-family: var(--font-display);
        }

        .modal input,
        .modal textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text-primary);
            margin-bottom: 1rem;
            font-size: 0.95rem;
            font-family: var(--font-ui);
            font-weight: 600;
            outline: none;
            transition: border-color 0.2s;
        }

        .modal input:focus,
        .modal textarea:focus {
            border-color: var(--accent);
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 0.5rem;
        }

        @keyframes modalPop {
            from {
                transform: scale(0.95) translateY(10px);
                opacity: 0;
            }

            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        .modal-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 0.3rem;
            margin-top: 0.5rem;
            display: block;
        }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--surface);
            border-left: 5px solid var(--success);
            border: 1px solid var(--border);
            border-left-width: 5px;
            border-left-color: var(--success);
            padding: 0.9rem 1.5rem;
            border-radius: 10px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            z-index: 1200;
            font-family: var(--font-ui);
            font-weight: 600;
            color: var(--text-primary);
            transform: translateX(calc(100% + 3rem));
            transition: transform 0.3s cubic-bezier(.175, .885, .32, 1.275);
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast-icon {
            font-size: 1.1rem;
        }

        /* ── Empty State ── */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }

        .empty-state h3 {
            font-size: 1.4rem;
            margin: 1rem 0 0.5rem;
            color: var(--text-primary);
        }

        .empty-state p {
            margin-bottom: 1.5rem;
        }

        @keyframes dropIn {
            from {
                opacity: 0;
                transform: translateY(-6px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
    </style>
</head>

        `).join('');
                document.querySelectorAll('.category-pill').forEach(p => {
                    p.addEventListener('click', () => { selectedCat = p.dataset.cat; render(); });
                });
            }

            // ── Render ───────────────────────────────────────────────────
            function render() {
                const term = ($('searchInput').value || '').trim().toLowerCase();
                let filtered = vasItems.filter(v => {
                    const matchSearch = !term || v.title.toLowerCase().includes(term) || v.info.toLowerCase().includes(term) || v.description.toLowerCase().includes(term);
                    const matchCat = selectedCat === 'all' || getCategory(v.title) === selectedCat;
                    return matchSearch && matchCat;
                });

                $('totalVas').textContent = vasItems.length;

                const container = $('vasContainer');
                if (filtered.length === 0) {
                    container.innerHTML = `
                <div class="empty-state">
                    <div style="font-size:3rem">🔍</div>
                    <h3>Nothing found…</h3>
                    <p>Try different keywords.</p>
                    <button class="btn" onclick="document.getElementById('searchInput').value='';document.getElementById('searchInput').dispatchEvent(new Event('input'))">Clear search</button>
                </div>`;
                } else {
                    container.innerHTML = filtered.map((v, i) => `
                <div class="vas-card" data-id="${v.id}" style="animation-delay:${i * 0.03}s">
                    <div class="copy-flash"></div>
                    <div class="vas-title">${esc(v.title)}</div>
                    <div class="vas-info-preview">${esc(v.info)}</div>
                    <div class="vas-card-bottom">
                        <span class="vas-copy-hint"><i class="fas fa-hand-pointer"></i> click to copy</span>
                    </div>
                    ${v.description ? `<div class="vas-tooltip">${esc(v.description)}</div>` : ''}
                </div>
            `).join('');
                }

                rebuildPills();
            }

            // ── Copy ─────────────────────────────────────────────────────
            async function handleCopy(id) {
                const v = vasItems.find(v => v.id === id);
                if (!v) return;
                try {
                    await navigator.clipboard.writeText(v.info);
                    showToast('Copied!');
                    const card = document.querySelector(`.vas-card[data-id="${id}"]`);
                    if (card) { card.classList.remove('copied'); void card.offsetWidth; card.classList.add('copied'); setTimeout(() => card.classList.remove('copied'), 600); }
                } catch { showToast('Copy failed!', 'var(--danger)'); }
            }

            // ── Click ─────────────────────────────────────────────────────
            document.addEventListener('click', e => {
                hideCtxMenu();
                const card = e.target.closest('.vas-card');
                if (card) handleCopy(card.dataset.id);
            });

            // ── Context Menu ──────────────────────────────────────────────
            const ctxMenu = $('ctxMenu');
            let ctxTargetId = null;

            function hideCtxMenu() { ctxMenu.classList.remove('open'); }

            document.addEventListener('contextmenu', e => {
                const card = e.target.closest('.vas-card');
                if (!card) return;
                e.preventDefault();
                ctxTargetId = card.dataset.id;
                ctxMenu.style.left = Math.min(e.clientX, window.innerWidth - 185) + 'px';
                ctxMenu.style.top = Math.min(e.clientY, window.innerHeight - 120) + 'px';
                ctxMenu.classList.add('open');
            });

            document.addEventListener('keydown', e => { if (e.key === 'Escape') hideCtxMenu(); });

            $('ctxCopy').addEventListener('click', () => { handleCopy(ctxTargetId); hideCtxMenu(); });
            $('ctxDelete').addEventListener('click', () => { showDeleteConfirm(ctxTargetId); hideCtxMenu(); });

            // ── Delete Confirm ────────────────────────────────────────────
            function showDeleteConfirm(id) {
                const v = vasItems.find(v => v.id === id);
                if (!v) return;
                const m = document.createElement('div');
                m.className = 'modal-overlay';
                m.innerHTML = `
            <div class="modal delete-modal">
                <div class="delete-icon">🗑️</div>
                <h3>Delete item?</h3>
                <p class="delete-title">"${esc(v.title)}"</p>
                <p class="delete-warning">This action cannot be undone.</p>
                <div class="modal-actions">
                    <button class="btn btn-cancel-d">Cancel</button>
                    <button class="btn btn-danger btn-confirm-d">Delete</button>
                </div>
            </div>`;
                document.body.appendChild(m);
                m.classList.add('show');

                const close = () => { m.classList.remove('show'); setTimeout(() => m.remove(), 150); };
                m.querySelector('.btn-cancel-d').addEventListener('click', close);
                m.querySelector('.btn-confirm-d').addEventListener('click', () => {
                    vasItems = vasItems.filter(v => v.id !== id);
                    save(); close();
                    showToast('Deleted', 'var(--danger)');
                });
                m.addEventListener('click', e => { if (e.target === m) close(); });
            }

            // ── Search ────────────────────────────────────────────────────
            $('searchInput').addEventListener('input', render);
            $('clearSearch').addEventListener('click', () => { $('searchInput').value = ''; render(); $('searchInput').focus(); });
            document.addEventListener('keydown', e => {
                if (e.ctrlKey && e.key === 'f') { e.preventDefault(); $('searchInput').focus(); $('searchInput').select(); }
            });

            // ── Init ──────────────────────────────────────────────────────
            render();

        })();
    </script>
</body>

</html>
